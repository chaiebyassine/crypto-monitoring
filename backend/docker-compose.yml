version: "3.9"

services:
  db:
    image: postgres:16
    container_name: gla-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gla_user
      POSTGRES_PASSWORD: gla_pass
      POSTGRES_DB: gla_db
    ports:
      - "5432:5432"
    volumes:
      - gla-db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gla_user -d gla_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: gla-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "3001:3001"
    command: npm run dev

  # SonarQube pour analyse qualité du code
  sonarqube:
    image: sonarqube:lts-community
    container_name: gla-sonarqube
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db

  # Base de données dédiée pour SonarQube
  sonar-db:
    image: postgres:15
    container_name: gla-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data

  # Prometheus pour la collecte des métriques
  prometheus:
    image: prom/prometheus:latest
    container_name: gla-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - backend

  # Grafana pour la visualisation des métriques
  grafana:
    image: grafana/grafana:latest
    container_name: gla-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  gla-db-data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
  prometheus_data:
  grafana_data:
