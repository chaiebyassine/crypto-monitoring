# Configuration SonarQube pour le projet GLA Backend

# Identifiant unique du projet
sonar.projectKey=gla-backend
sonar.projectName=GLA Backend
sonar.projectVersion=1.0.0

# Chemin des sources (exclure les tests des sources)
sonar.sources=src
sonar.tests=src/tests
sonar.test.inclusions=src/tests/**/*.test.ts,src/tests/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/tests/**

# Langage
sonar.sourceEncoding=UTF-8

# Couverture de tests (généré par Vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# URL du serveur SonarQube (local Docker)
sonar.host.url=http://localhost:9000

# Token d'authentification (à configurer après premier lancement)
# sonar.login=votre_token_ici
