# Configuration SonarQube pour le projet GLA Backend

# Identifiant unique du projet
sonar.projectKey=gla-backend
sonar.projectName=GLA Backend
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=src/tests
sonar.test.inclusions=src/tests/**/*.test.ts,src/tests/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/tests/**


sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.host.url=http://localhost:9000

