apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: gla-crypto
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  PORT: "3001"
  PROVIDER: "coingecko"
  COINGECKO_API_URL: "https://api.coingecko.com/api/v3"
  JWT_EXPIRES_IN: "7d"
